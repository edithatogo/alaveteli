name: Security & DevSecOps

on:
  push:
    branches: [master, develop]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  security-events: write

jobs:
  brakeman:
    name: Brakeman Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
        bundler-cache: true

    - name: Run Brakeman
      run: |
        gem install brakeman --version 8.0.5
        ruby scripts/test_verify_brakeman_baseline.rb
        brakeman -z --ignore-config config/brakeman.ignore \
          --format json --output brakeman-report.json
        ruby scripts/verify_brakeman_baseline.rb \
          config/brakeman.ignore brakeman-report.json

    - name: Upload Brakeman report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: brakeman-report
        path: brakeman-report.json
        if-no-files-found: error

  bundler-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
        bundler-cache: true

    - name: Run bundler-audit
      run: |
        gem install bundler-audit
        bundle-audit check --update

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Dependency Review
      uses: actions/dependency-review-action@v4

  bearer:
    name: Bearer Static Analysis (Advisory)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Run Bearer Scan
      uses: bearer/bearer-action@v2
      with:
        format: sarif
        output: results.sarif
      continue-on-error: true
    - name: Retain Bearer SARIF
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bearer-sarif
        path: results.sarif
        if-no-files-found: warn
