name: Changelog

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Base branch used for the changed-files comparison'
        required: true
        default: develop
      pr_body:
        description: 'Pull request body used for changelog policy evaluation'
        required: false
        default: '[skip changelog]'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      BASE_REF: ${{ github.event.pull_request.base.ref || inputs.base_ref || github.event.repository.default_branch }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check for [skip changelog]
      id: skip
      env:
        PR_DESCRIPTION: ${{ github.event.pull_request.body || inputs.pr_body }}
      run: |
        if echo "$PR_DESCRIPTION" | grep -q "\[skip changelog\]"; then
          echo "skip_changelog=true" >> $GITHUB_OUTPUT
        else
          echo "skip_changelog=false" >> $GITHUB_OUTPUT
        fi

    - name: Check for changes in doc/CHANGES.md
      id: changes
      run: |
        git fetch origin "$BASE_REF"
        FILES_CHANGED=$(git diff --name-only "origin/$BASE_REF" "${{ github.sha }}")
        if [[ "$FILES_CHANGED" == *"doc/CHANGES.md"* ]]; then
          echo "changes_found=true" >> $GITHUB_OUTPUT
        else
          echo "changes_found=false" >> $GITHUB_OUTPUT
        fi

    - name: Final Check
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
      run: |
        if [[ "${{ steps.skip.outputs.skip_changelog }}" == "true" || "${{ steps.changes.outputs.changes_found }}" == "true" ]]; then
          echo "Either [skip changelog] was found or doc/CHANGES.md was modified. Passing the action."
          exit 0
        else
          echo "Neither [skip changelog] was found nor was doc/CHANGES.md modified. Failing the action."
          exit 1
        fi
